<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Łap Chwilę</title><meta name="description" content="Łap Chwilę — zachowuj swoje najpiękniejsze wspomnienia.">
<style>
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8f5;color:#20251f}button{font:inherit}.header{background:rgba(255,255,255,.92);backdrop-filter:blur(14px);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e9ece6;position:sticky;top:0;z-index:20}.logo{font-size:23px;font-weight:800;letter-spacing:-.4px}.login{background:#20251f;color:#fff;border:0;padding:11px 19px;border-radius:999px;font-weight:700;cursor:pointer;transition:.2s}.login:hover{transform:translateY(-1px);opacity:.92}.banner{width:100%;min-height:390px;display:flex;align-items:flex-end;justify-content:center;padding:55px 20px;background-image:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.56)),url("https://jcmwjmaywkmnjrciziix.supabase.co/storage/v1/object/public/photos/39f2480d-ae50-407f-9b2f-794afdc3a120/1787498073839-1000047432.jpg");background-size:cover;background-position:center;color:#fff}.banner-content{text-align:center;text-shadow:0 3px 18px rgba(0,0,0,.35)}.banner h1{font-size:clamp(42px,8vw,72px);letter-spacing:-2px}.banner p{font-size:18px;margin-top:7px}.profile{max-width:1000px;margin:30px auto 0;padding:0 20px;display:flex;align-items:center;gap:14px}.profile-avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#79b85a;color:#fff;font-size:23px}.profile-info h2{font-size:20px}.profile-info p{margin-top:3px;color:#777;font-size:14px}.hero{text-align:center;padding:38px 20px 28px}.hero p{font-size:18px;color:#666;max-width:620px;margin:auto;line-height:1.6}.add{margin-top:22px;background:#79b85a;color:#fff;border:0;padding:14px 25px;border-radius:999px;font-size:16px;font-weight:750;cursor:pointer;box-shadow:0 8px 24px rgba(78,130,54,.18);transition:.2s}.add:hover{transform:translateY(-2px);box-shadow:0 11px 28px rgba(78,130,54,.24)}.gallery{max-width:1050px;margin:0 auto 65px;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:20px}.photo-card{position:relative;overflow:hidden;border-radius:20px;background:#fff;box-shadow:0 8px 28px rgba(25,35,25,.09);transition:transform .2s,box-shadow .2s}.photo-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(25,35,25,.13)}.photo-card img{width:100%;height:255px;object-fit:cover;display:block;cursor:zoom-in}.delete-photo{position:absolute;top:11px;right:11px;border:0;background:rgba(20,20,20,.72);color:#fff;width:39px;height:39px;border-radius:50%;cursor:pointer;font-size:17px;backdrop-filter:blur(5px);transition:.2s}.delete-photo:hover{background:#c0392b;transform:scale(1.05)}footer{text-align:center;padding:32px;color:#8a9087;background:#fff;border-top:1px solid #e9ece6;font-size:14px}@media(max-width:600px){.header{padding:14px 16px}.logo{font-size:20px}.banner{min-height:300px;padding-bottom:38px}.banner h1{letter-spacing:-1px}.banner p{font-size:16px}.profile{margin-top:22px;padding:0 16px}.hero{padding:30px 18px 20px}.gallery{grid-template-columns:1fr 1fr;gap:12px;padding:16px}.photo-card{border-radius:15px}.photo-card img{height:190px}.delete-photo{width:35px;height:35px;top:8px;right:8px}.add{width:100%;max-width:330px}}@media(max-width:390px){.gallery{grid-template-columns:1fr}.photo-card img{height:auto;max-height:520px}}
</style>
</head>
<body>
<header class="header"><div class="logo">🌿 Łap Chwilę</div><button class="login">Zaloguj</button></header>
<main>
<section class="banner" aria-label="Baner Łap Chwilę"><div class="banner-content"><h1>Łap chwilę.</h1><p>Twoje wspomnienia. Twoje momenty. Na zawsze.</p></div></section>
<section class="profile"><div class="profile-avatar">👤</div><div class="profile-info"><h2>Moje chwile</h2><p id="photoCount">0 zapisanych chwil</p></div></section>
<section class="hero"><p>Zachowuj zdjęcia, wspomnienia i wyjątkowe momenty, do których chcesz wracać.</p><button class="add">＋ Dodaj chwilę</button></section>
<section class="gallery" aria-label="Moje zapisane chwile"></section>
</main><footer>© 2026 Łap Chwilę</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=6"></script>
</body></html>
