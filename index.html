<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Łap Chwilę</title>
  <meta name="description" content="Łap Chwilę — zachowuj swoje najpiękniejsze wspomnienia.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f8f5;
      color: #222;
    }

    header {
      background: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
    }

    .login {
      background: #222;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }

    .hero {
      text-align: center;
      padding: 70px 20px 50px;
    }

    .hero h1 {
      font-size: 44px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 19px;
      color: #666;
      max-width: 600px;
      margin: auto;
      line-height: 1.6;
    }

    .add {
      margin-top: 30px;
      background: #79b85a;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 30px;
      font-size: 17px;
      cursor: pointer;
    }

    .gallery {
      max-width: 1000px;
      margin: 0 auto 60px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .gallery img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #888;
      background: white;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🌿 Łap Chwilę</div>
    <button class="login">Zaloguj</button>
  </header>

  <main>

    <section class="hero">
      <h1>Łap chwilę.</h1>

      <p>
        Zachowuj zdjęcia, wspomnienia i wyjątkowe momenty,
        do których chcesz wracać.
      </p>

      <button class="add">＋ Dodaj chwilę</button>
    </section>

    <section class="gallery">
      <img src="travel-01.jpg" alt="Wspomnienie">
      <img src="travel-02.jpg" alt="Wspomnienie">
      <img src="travel-03.jpg" alt="Wspomnienie">
      <img src="travel-04.jpg" alt="Wspomnienie">
      <img src="travel-05.jpg" alt="Wspomnienie">
      <img src="travel-06.jpg" alt="Wspomnienie">
      <img src="travel-07.jpg" alt="Wspomnienie">
    </section>

  </main> 

  <footer>
    © 2026 Łap Chwilę
  </footer> 
<script>
alert("INDEX DZIAŁA");
</script>
  <script src="./app.js?v=2"></script>

</body>
</html>
