name: Fix woman background visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-woman-background.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append background visibility overrides
        run: |
          if ! grep -q 'LAP_CHWILE_WOMAN_BG_FIX' woman-bench.css; then
            cat >> woman-bench.css <<'EOF'

/* LAP_CHWILE_WOMAN_BG_FIX */
body{background:transparent!important}
body:before{content:""!important;position:fixed!important;inset:0!important;z-index:0!important;background-position:center center!important;background-size:cover!important;background-repeat:no-repeat!important;background-attachment:fixed!important;opacity:1!important;filter:contrast(1.35) brightness(.82) saturate(1.12)!important;pointer-events:none!important}
.banner{background:transparent!important;position:relative!important;z-index:1!important}
.banner-content{text-shadow:0 3px 22px rgba(0,0,0,.72)!important}
.hero{background:rgba(255,255,255,.52)!important;backdrop-filter:blur(2px)!important}
EOF
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add woman-bench.css
            git commit -m 'fix: make woman on bench background visible'
            git push
          fi
